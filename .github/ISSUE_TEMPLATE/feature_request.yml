name: Feature request
description: Suggest an improvement or new capability for Manifestor
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Describe the underlying problem so the proposal can be evaluated in context.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow limitation or user need should this address?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed behavior
      description: Describe how you would like Manifestor to behave.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you considered.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, mockups, or related links that clarify the request.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for similar requests.
          required: true
